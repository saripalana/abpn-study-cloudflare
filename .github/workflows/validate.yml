name: Validate ABPN Study Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --silent
      - name: Verify pinned K&S source, unit tests, and Worker build
        id: verify
        continue-on-error: true
        run: npm run verify > verify.log 2>&1
      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-log
          path: verify.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail when verification fails
        if: steps.verify.outcome == 'failure'
        run: exit 1
      - name: Reject stale generated browser assets
        run: git diff --exit-code -- src public package.json
      - name: Confirm generated approved-deck manifests
        run: |
          test -f public/banks/generated/ks-psychiatry-core.js
          test -f public/banks/generated/ks-psychiatry-core.manifest.json
          grep -q '"questionCount": 602' public/banks/generated/ks-psychiatry-core.manifest.json
          test -f public/banks/generated/spiegel-test-prep.js
          test -f public/banks/generated/spiegel-test-prep.manifest.json
          grep -q '"questionCount": 1060' public/banks/generated/spiegel-test-prep.manifest.json
      - name: Install desktop Chromium
        id: playwright_install
        continue-on-error: true
        run: timeout --signal=TERM --kill-after=30s 20m npx playwright install --with-deps chromium > playwright-install.log 2>&1
      - name: Upload Playwright installation log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-install-log
          path: playwright-install.log
          if-no-files-found: warn
          retention-days: 7
      - name: Fail when Playwright installation fails or times out
        if: steps.playwright_install.outcome == 'failure'
        run: |
          tail -n 200 playwright-install.log || true
          exit 1
      - name: Start shared local validation server
        id: validation_server
        continue-on-error: true
        run: |
          setsid python3 -m http.server 8787 --bind 127.0.0.1 --directory public > validation-server.log 2>&1 &
          echo "$!" > validation-server.pid
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8787/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Fail when validation server does not start
        if: steps.validation_server.outcome == 'failure'
        run: |
          tail -n 200 validation-server.log || true
          exit 1
      - name: Verify import button smoke flow
        id: import_smoke
        continue-on-error: true
        env:
          PLAYWRIGHT_REUSE_SERVER: "true"
        run: timeout --signal=TERM --kill-after=10s 90s npx playwright test tests/e2e/import-button.spec.js --project=chromium-desktop --workers=1 --retries=0 --reporter=json > import-button-report.json
      - name: Upload import smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: import-button-report
          path: |
            import-button-report.json
            test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Fail when import smoke validation fails
        if: steps.import_smoke.outcome == 'failure'
        run: exit 1
      - name: Run remaining desktop Chrome flows
        id: desktop
        continue-on-error: true
        env:
          PLAYWRIGHT_REUSE_SERVER: "true"
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8787/ > /dev/null
          timeout --signal=TERM --kill-after=30s 10m npx playwright test --project=chromium-desktop --grep-invert='Import question bank opens' --workers=1 --reporter=json > desktop-chrome-report.json
      - name: Upload desktop Chrome report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-chrome-report
          path: |
            desktop-chrome-report.json
            test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Fail when desktop Chrome validation fails
        if: steps.desktop.outcome == 'failure'
        run: exit 1
      - name: Stop shared local validation server
        if: always()
        run: |
          if test -f validation-server.pid; then
            server_pid="$(cat validation-server.pid)"
            kill -- "-$server_pid" 2>/dev/null || true
          fi
      - name: Upload validation server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-server-log
          path: validation-server.log
          if-no-files-found: warn
          retention-days: 7
