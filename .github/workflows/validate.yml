name: Validate ABPN Study Cloudflare

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Verify pinned K&S source, tests, and Worker build
        run: npm run verify
      - name: Confirm generated K&S manifest
        run: |
          test -f public/banks/generated/ks-psychiatry-core.js
          test -f public/banks/generated/ks-psychiatry-core.manifest.json
          grep -q '"questionCount": 602' public/banks/generated/ks-psychiatry-core.manifest.json
