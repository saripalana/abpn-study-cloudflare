name: Validate ABPN Study Cloudflare

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --silent
      - name: Verify external K&S source, unit tests, and Worker build
        id: verify
        continue-on-error: true
        run: npm run verify > verify.log 2>&1
      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-log
          path: verify.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail when verification fails
        if: steps.verify.outcome == 'failure'
        run: exit 1
      - name: Confirm K&S content is not bundled
        run: |
          test ! -e public/banks/generated/ks-psychiatry-core.js
          test ! -e public/banks/generated/ks-psychiatry-core.manifest.json
          grep -q 'KS_STARTER_SOURCE' public/client/starter-decks.js
          grep -q 'no K&S content was generated into this repository' scripts/import-ks-bank.mjs
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit >/tmp/playwright-install.log 2>&1 || { tail -n 200 /tmp/playwright-install.log; exit 1; }
      - name: Run desktop Chrome flows
        id: desktop
        continue-on-error: true
        run: npx playwright test --project=chromium-desktop --reporter=json > desktop-chrome-report.json
      - name: Upload desktop Chrome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-chrome-report
          path: |
            desktop-chrome-report.json
            test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Fail when desktop Chrome validation fails
        if: steps.desktop.outcome == 'failure'
        run: exit 1
      - name: Run iPhone 13 Safari flows
        id: iphone
        continue-on-error: true
        run: npx playwright test --project=iphone-13-safari --reporter=json > iphone-safari-report.json
      - name: Upload iPhone Safari report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-safari-report
          path: |
            iphone-safari-report.json
            test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Fail when iPhone Safari validation fails
        if: steps.iphone.outcome == 'failure'
        run: exit 1
