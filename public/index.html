<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>ABPN Psychiatry Study</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/data-management.css">
  <link rel="stylesheet" href="/github-question-bank-import.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">ABPN PSYCHIATRY STUDY</div>
      <h1>Board Practice</h1>
      <p class="subtitle">Local-first study with protected Cloudflare synchronization.</p>
    </div>
    <div class="header-actions">
      <span id="syncStatus" class="sync-status">Local only</span>
      <button id="syncBtn" class="ghost" type="button">Sync</button>
      <button id="homeBtn" class="ghost" type="button" hidden>Dashboard</button>
    </div>
  </header>
  <main id="app" class="shell" aria-live="polite">
    <section class="loading-card">Loading question banks…</section>
  </main>
  <input
    id="bankImportInput"
    type="file"
    accept="application/json,.json"
    tabindex="-1"
    aria-hidden="true"
    style="position:fixed;left:-10000px;top:0;width:1px;height:1px;opacity:0;pointer-events:none"
  >
  <footer>Unofficial personal study tool. Not produced or endorsed by ABPN.</footer>
  <script src="/active-autosave-guard.js"></script>
  <script src="/import-button-bridge.js"></script>
  <script type="module" src="/bootstrap.js"></script>
  <script type="module" src="/sync-controller.js"></script>
  <script type="module" src="/backup-controller.js"></script>
  <script type="module" src="/data-management-controller.js"></script>
  <script type="module" src="/question-bank-controller.js"></script>
  <script type="module" src="/github-question-bank-controller.js"></script>
</body>
</html>
