name = "abpn-study-cloudflare"
main = "src/access-worker.js"
compatibility_date = "2026-07-20"

# The Worker runs before every asset request so Cloudflare Access JWT validation
# is enforced before the application or question-bank files are served.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# D1 stores only the signed-in user's synchronized study records. Local
# IndexedDB remains primary, and server/client guardrails fail back to local-only.
[[d1_databases]]
binding = "DB"
database_name = "abpn-study-db"
database_id = "356b5061-81c2-4327-bdec-27127e03319d"
migrations_dir = "./migrations"

[vars]
APP_ENV = "development"
APP_RELEASE_MODE = "full"
CLOUD_SYNC_ENABLED = "true"
STUDY_USER_ID = "f0ac0ac0-4fdd-4c36-a305-29c3182fc9b0"
ACCESS_JWT_REQUIRED = "true"
ACCESS_TEAM_DOMAIN = "https://falling-snow-6183.cloudflareaccess.com"
ACCESS_POLICY_AUD = "efe6977a32c7d52f79c07e63673f5daf7b63d306777391d17fa8c739484f0dd6"
